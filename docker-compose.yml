services:

  cosmos_api:

    build:
      context: ./backend

    container_name: cosmos_api

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      COSMOS_SYSTEM_OWNER_USERNAME: "systemowner"
      COSMOS_SYSTEM_OWNER_EMAIL: "owner@cosmos.com"
      COSMOS_SYSTEM_OWNER_PASSWORD: "System!123"

    restart: always

  cosmos_frontend:

    build:
      context: ./frontend

    container_name: cosmos_frontend

    ports:
      - "3000:80"

    environment:
      API_BASE_URL: ${COSMOS_API_BASE_URL:?Set COSMOS_API_BASE_URL to the frontend API origin}

    restart: always

    depends_on:
      - cosmos_api
