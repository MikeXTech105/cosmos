services:

  cosmos_api:

    build:
      context: ./backend

    container_name: cosmos_api

    ports:
      - "8080:8080"

    environment:
      COSMOS_SYSTEM_OWNER_USERNAME: "systemowner"
      COSMOS_SYSTEM_OWNER_EMAIL: "owner@cosmos.com"
      COSMOS_SYSTEM_OWNER_PASSWORD: "System!123"

    restart: always

  cosmos_frontend:

    build:
      context: ./frontend

    container_name: cosmos_frontend

    ports:
      - "3000:80"

    restart: always

    depends_on:
      - cosmos_api
