version: '3.9'

services:

  cosmos_api:

    build:
      context: ./backend/CosmosERP.API

    container_name: cosmos_api

    ports:
      - "8080:8080"

    restart: always

  cosmos_frontend:

    build:
      context: ./frontend

    container_name: cosmos_frontend

    ports:
      - "3000:80"

    restart: always

    depends_on:
      - cosmos_api